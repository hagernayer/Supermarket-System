<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supermarket</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <!-- Window Buttons -->
        <div class="window-buttons">

            <button class="window-btn close">×</button>

            <button class="window-btn minimize">−</button>

        </div>


        <!-- Search -->
        <div class="search-box">

            <input
                type="search"
                placeholder="ابحث عن منتج..."
                class="search"
            >

            <button class="search-btn">🔍</button>

        </div>

    </header>


    <!-- Categories -->
    <nav class="categories">

        <button class="category active">
            المشروبات
        </button>

        <button class="category">
            اللحوم والدواجن
        </button>

        <button class="category">
            الخضراوات والفاكهة
        </button>

        <button class="category">
            السناكس والحلويات
        </button>

    </nav>


    <!-- Products -->
    <main class="products">


        <!-- Water -->
        <div class="product-card">

            <div class="product-image">

                <img
                    src="https://m.media-amazon.com/images/S/aplus-media/sota/b7ceffa4-8eb2-4a6e-9817-cd594aaec0b0.__CR0,0,300,300_PT0_SX300_V1___.jpg"
                    alt="Hayat Water"
                >

            </div>

            <h3>Hayat Water</h3>

            <p class="price">
                15 EGP
            </p>


            <div class="quantity">

                <button class="quantity-btn">
                    −
                </button>

                <span>
                    1
                </span>

                <button class="quantity-btn">
                    +
                </button>

            </div>


            <button class="cart-btn">
                أضف إلى السلة
            </button>

        </div>


        <!-- Pepsi -->
        <div class="product-card">

            <div class="product-image">

                <img
                    src="https://png.pngtree.com/png-vector/20231023/ourmid/pngtree-pepsi-produced-in-tyumen-russia-by-pepsico-many-png-image_10295472.png"
                    alt="Pepsi"
                >

            </div>

            <h3>
                Pepsi
            </h3>

            <p class="price">
                15 EGP
            </p>


            <div class="quantity">

                <button class="quantity-btn">
                    −
                </button>

                <span>
                    1
                </span>

                <button class="quantity-btn">
                    +
                </button>

            </div>


            <button class="cart-btn">
                أضف إلى السلة
            </button>

        </div>


        <!-- Coca Cola -->
        <div class="product-card">

            <div class="product-image">

                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYlAh09Mmrm2Su-zvuLqPsQFc_hDZsUz1TcynJLKSxWg&s"
                    alt="Coca Cola"
                >

            </div>

            <h3>
                Coca Cola
            </h3>

            <p class="price">
                15 EGP
            </p>


            <div class="quantity">

                <button class="quantity-btn">
                    −
                </button>

                <span>
                    1
                </span>

                <button class="quantity-btn">
                    +
                </button>

            </div>


            <button class="cart-btn">
                أضف إلى السلة
            </button>

        </div>


    </main>

</body>

</html>
